<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonder Woman vs Venom</title>

    <style>
       
        body {
            height: 100vh;
            background: rgb(3, 3, 3);
            overflow: hidden;
            perspective: 1000px;
        }

        .box1 {
            position: absolute;
            left: 20px;
            top: 130px;

            animation: wonderwoman 3s ease-in-out forwards;
        }

        .box1 img {
            width: 200px;
            height: auto;
            display: block;
        }

        .box2 {
            position: absolute;
            right: 25px;
            top: 150px;
            width: 300px;
            height: 300px;

            animation: venom 3s ease-in-out forwards;
        }

        .box2 img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        @keyframes wonderwoman {
            0% {
                transform: translateX(0px)
                           scale(0.88)
                           rotate(0deg);
            }

            50% {
                transform: translateX(700px)
                           scale(1.2)
                           rotate(0deg);
            }

            75% {
                transform: translateX(700px)
                           scale(1.2)
                           rotate(360deg);
            }

            100% {
                transform: translateX(700px)
                           translateZ(200px)
                           scale(1.2)
                           rotate(360deg);
            }
        }

        @keyframes venom {
            0% {
                transform: translateX(0px)
                           scale(0.85)
                           rotate(0deg);
            }

            50% {
                transform: translateX(-500px)
                           scale(1.2)
                           rotate(0deg);
            }

            75% {
                transform: translateX(-500px)
                           scale(0.7)
                           rotate(0deg);
            }
            100% {
                transform: translateX(500px)
                           scale(0.7)
                           rotate(720deg);
            }
        }
    </style>
</head>

<body>
    <div class="box1">
        <img src="Wonder Woman.png" alt="Wonder Woman">
    </div>

    <div class="box2">
        <img src="venom2.png" alt="Venom">
    </div>
</body>
</html>
